primaryDBLocation=./testDB.db
secondaryDBLocation=./knocknock_secondary.db
anonymousUserTemplate=
defaultAuthenticationMethod=sha256
defaultAuthenticationString=db89a15ca72c6c91a94c03e6b7973bbbf01b3e67988c9f79d6b764b36d913a66
allowedAuthMethods=simpledb,sha256,scr,argon2id
sessionExpirationTimeout=180
# Rate limiting: maxLoginAttempts failed login attempts before lockout for loginLockoutSeconds duration
# (doubling with each further failure); the failure history is forgotten after loginFailureResetSeconds without a failure
maxLoginAttempts=5
loginLockoutSeconds=30
loginFailureResetSeconds=3600

# HTTP channel configuration
http.port=8081
http.threadPoolSize=2
http.cookieHttpOnly=true
http.cookiePath=/
http.cookieSecure=false
http.cookieSameSite=Strict

pluginManager.pluginPath=
pluginManager.activePlugins=

#publishers
sessionPublishers=express,mqtt
sessionPublisher.sqlite.dbPath=

sessionPublisher.mqtt.brokerAddress=tcp://127.0.0.1:1883
sessionPublisher.mqtt.clientId=knocknock
sessionPublisher.mqtt.userName=
sessionPublisher.mqtt.password=
sessionPublisher.mqtt.topic=userSessions
